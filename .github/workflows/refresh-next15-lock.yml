name: Refresh Next 15 lockfile

on:
  push:
    branches:
      - chore/solara-hardening-3-7

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): refresh Next 15 lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/solara-hardening-3-7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade framework dependencies and regenerate lockfile
        run: npm install --save-exact next@15.5.25 react@19.3.0 react-dom@19.3.0 && npm install --save-dev --save-exact eslint-config-next@15.5.25 @types/react@19.3.0 @types/react-dom@19.3.0

      - name: Commit regenerated dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): refresh Next 15 lockfile"
          git push origin HEAD:chore/solara-hardening-3-7
