name: Validate Solara hardening

on:
  push:
    branches:
      - chore/solara-hardening-3-7

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:check-migration-diff
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
