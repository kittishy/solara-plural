<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141020" />
    <title>Solara - sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141020; color: #f7f3ff; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 360px; }
      .mark { width: 56px; height: 56px; margin: 0 auto 24px; border-radius: 50%; background: #8b5cf6; box-shadow: 0 0 48px #8b5cf688; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #cfc5df; line-height: 1.55; }
      button { min-height: 48px; border: 0; border-radius: 999px; padding: 0 24px; background: #8b5cf6; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Você está sem conexão</h1>
      <p>Seus dados privados não ficam salvos nesta tela. Reconecte-se para continuar na Solara.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
